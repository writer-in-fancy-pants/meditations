<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neurofeedback Training</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </span>
      <span class="topbar-title">Neurofeedback Training</span>
      <span class="topbar-sub">Muse 2 · muselsl</span>
    </div>
    <div class="topbar-right">
      <div class="ws-status" id="wsStatus">
        <span class="ws-dot" id="wsDot"></span>
        <span id="wsLabel">Disconnected</span>
      </div>
      <button class="icon-btn" id="connectBtn">Connect</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="mode-nav" id="modeNav" role="tablist">
    <button class="mode-tab active" data-mode="at" role="tab" aria-selected="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      Alpha / Theta
    </button>
    <button class="mode-tab" data-mode="hrv" role="tab" aria-selected="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      HRV
    </button>
    <button class="mode-tab mode-tab-howto" data-mode="howto" role="tab" aria-selected="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      How To
    </button>
  </nav>

  <div class="connect-banner" id="connectBanner" style="display:none">
    <div class="banner-inner">
      <p class="banner-title">Connect to muselsl bridge</p>
      <p class="banner-sub">
        Run <code>python bridge.py</code>, then enter the WebSocket address.
        For HRV without Muse, run <code>python hr_rr_simulator.py --scenario meditation --loop</code>.
      </p>
      <div class="banner-row">
        <input type="text" id="wsUrlInput" value="ws://localhost:8765" class="ws-input" />
        <button class="btn-primary" id="doConnectBtn">Connect</button>
      </div>
    </div>
  </div>

  <main class="main">
    <div id="modePanel"></div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!-- 1. hammerjs – touch gesture recognition required by chartjs-plugin-zoom -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<!-- 2. chartjs-plugin-zoom -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="../lib/chartUtils.js"></script>
<script src="../lib/audio.js"></script>
<script src="../lib/wsClient.js"></script>
<script src="../lib/theme.js"></script>
<script src="../lib/hrv.js"></script>
<script src="../lib/audioPanel.js"></script>
<script src="../lib/youtubeAudio.js"></script>
<script src="modes/at.js"></script>
<script src="modes/hrv.js"></script>
<script src="modes/howto.js"></script>
<script src="app.js"></script>
</body>
</html>
